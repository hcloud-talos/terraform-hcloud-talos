name: Developer Experience
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - next
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  terraform-check:
    name: IaC Check (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: terraform
            cli: terraform
            version: "~1.15.0"
            label: "Terraform ~1.15.0"
          - engine: terraform
            cli: terraform
            version: "~1.16.0"
            label: "Terraform ~1.16.0"
          - engine: tofu
            cli: tofu
            version: "~1.11.0"
            label: "OpenTofu ~1.11.0"
          - engine: tofu
            cli: tofu
            version: "~1.12.0"
            label: "OpenTofu ~1.12.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure IaC plugin cache
        run: |
          printf 'plugin_cache_dir = "%s/.terraform.d/plugin-cache"\n' "$HOME" > ~/.terraformrc
          mkdir -p ~/.terraform.d/plugin-cache
      - name: Cache IaC
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: "${{ runner.os }}-${{ matrix.engine }}-${{ matrix.version }}-${{ hashFiles('.terraform.lock.hcl') }}"
          restore-keys: "${{ runner.os }}-${{ matrix.engine }}-"
      - name: Setup Terraform
        if: matrix.engine == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.version }}
      - name: Setup OpenTofu
        if: matrix.engine == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.version }}
      - name: Show Terraform version
        if: matrix.engine == 'terraform'
        run: terraform version
      - name: IaC Format
        id: fmt
        run: ${{ matrix.cli }} fmt -recursive -check -diff
        continue-on-error: true
      - name: IaC Init
        id: init
        run: ${{ matrix.cli }} init -no-color
        continue-on-error: true
      - name: IaC Validate
        id: validate
        run: ${{ matrix.cli }} validate -no-color
        continue-on-error: true
      - name: Test Kubernetes and Talos version upgrades
        run: ${{ matrix.cli }} test -test-directory=tests/upgrade -no-color
      - name: Test image and ISO selection
        env:
          IAC_CLI: ${{ matrix.cli }}
        run: ./tests/images.sh
      - name: Install Talos configuration validator
        run: |
          version="v1.14.$(jq -r '.["1.14"].minimum_patch' supported_versions.json)"
          tools="$RUNNER_TEMP/talos-tools"
          mkdir -p "$tools"
          cd "$tools"
          curl -fsSLO "https://github.com/siderolabs/talos/releases/download/$version/talosctl-linux-amd64"
          curl -fsSLO "https://github.com/siderolabs/talos/releases/download/$version/sha256sum.txt"
          grep ' talosctl-linux-amd64$' sha256sum.txt | sha256sum -c -
          mv talosctl-linux-amd64 talosctl
          chmod +x talosctl
          echo "$tools" >> "$GITHUB_PATH"
      - name: Test version policy and Talos configurations
        env:
          IAC_CLI: ${{ matrix.cli }}
        run: ./tests/run.sh
      - name: Test Packer version policy
        if: matrix.engine == 'terraform' && matrix.version == '~1.16.0'
        run: |
          tools="$RUNNER_TEMP/packer-tools"
          mkdir -p "$tools"
          cd "$tools"
          curl -fsSLO https://releases.hashicorp.com/packer/1.16.1/packer_1.16.1_linux_amd64.zip
          curl -fsSLO https://releases.hashicorp.com/packer/1.16.1/packer_1.16.1_SHA256SUMS
          grep ' packer_1.16.1_linux_amd64.zip$' packer_1.16.1_SHA256SUMS | sha256sum -c -
          unzip -q packer_1.16.1_linux_amd64.zip
          export PATH="$tools:$PATH"
          cd "$GITHUB_WORKSPACE"
          python3 tests/packer.py
      - name: Fail on error
        if: ${{
          steps.fmt.outcome != 'success'
          || steps.init.outcome != 'success'
          || steps.validate.outcome != 'success'
          }}
        run: |
          exit 1

  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node and Yarn Cache
        uses: ./.github/actions/setup-node-and-yarn-cache
        with:
          cache-dependency-path: .github/commitlint/yarn.lock
      - name: Yarn install
        run: yarn install --immutable --immutable-cache
        working-directory: ./.github/commitlint
      - name: Validate current commit (last commit) with commitlint
        if: github.event_name == 'push'
        run: yarn commitlint --last --verbose
        working-directory: ./.github/commitlint
      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: |
          yarn commitlint --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} --to ${{ github.event.pull_request.head.sha }} --verbose
        working-directory: ./.github/commitlint

  dev_xperience_status_check:
    name: DevXperience status check
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    needs:
      - terraform-check
      - commitlint
    steps:
      - name: Fail on error
        # see https://stackoverflow.com/a/67532120/4907315 and https://github.com/orgs/community/discussions/26822#discussioncomment-3305794
        if: >-
          ${{
               contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
          }}
        run: |
          echo There are failing or cancelled jobs
          exit 1
